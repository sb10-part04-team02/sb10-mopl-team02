name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

# 같은 PR에 새 커밋이 푸시되면 이전 실행 자동 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: 빌드 · 테스트 · 커버리지 · 린트
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 설정 (캐시)
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 포맷팅 검사 (Spotless)
        run: ./gradlew spotlessCheck

      - name: 린트 검사 (SpotBugs)
        run: ./gradlew spotbugsMain

      - name: 테스트
        run: ./gradlew test

      - name: 커버리지 리포트 (JaCoCo)
        run: ./gradlew jacocoTestReport

      - name: ✅ 커버리지 검증
        # 게이트는 PR에서만 실행 — dev/main push(merge)는 뱃지 갱신만 하고 막지 않음
        if: ${{ github.event_name == 'pull_request' }}
        run: ./gradlew jacocoTestCoverageVerification

      - name: 빌드/패키징 (bootJar)
        run: ./gradlew assemble

      - name: Codecov 리포트 업로드
        # 커버리지 검증 실패와 무관하게 뱃지 갱신을 위해 항상 업로드
        if: ${{ always() }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
