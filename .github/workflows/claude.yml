name: Claude PR Review

on:
  issue_comment:
    types: [ created ]
  pull_request_review_comment:
    types: [ created ]

concurrency:
  group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # PR에서만, @claude 멘션이 있을 때만 동작
    if: |
      (
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request != null) ||
        github.event_name == 'pull_request_review_comment'
      ) &&
      contains(github.event.comment.body, '@claude') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
            당신은 코드 리뷰어입니다. 이 PR을 리뷰하세요.
            반드시 한국어로 리뷰를 작성하세요.

            리뷰 기준:
            - 저장소 루트의 CLAUDE.md 컨벤션을 따르세요.
            - .coderabbit.yml 의 path_instructions 기준과 동일하게 판단하세요.
            - 변경된 파일에만 집중하고, 사소한 스타일보다 버그/보안/로직 오류를 우선하세요.
          claude_args: |
            --max-turns 15
            --model claude-opus-4-8
            --allowedTools "Read,Grep,Glob"
