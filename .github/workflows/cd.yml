name: CD

on:
  push:
    branches:
      - dev
  workflow_dispatch:

# 진행 중 배포는 취소하지 않고 대기
concurrency:
  group: cd-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECS_CLUSTER: mopl-cluster
  ECS_SERVICE: mopl-service
  APP_REPO: mopl-app
  EMAIL_PASSWORD_SECRET_NAME: mopl/email-password

jobs:
  deploy:
    name: 이미지 빌드 · task-def 등록 · ECS 배포
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC 토큰 발급
      contents: read

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 설정 · 캐시
        uses: gradle/actions/setup-gradle@v4

      - name: bootJar 빌드 (러너 네이티브)
        # 무거운 Gradle 빌드를 도커 밖에서 수행 → 도커 빌드는 JAR 복사만 하므로 ARM64 크로스빌드가 빨라짐
        run: ./gradlew clean bootJar --no-daemon

      - name: AWS 자격 증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: buildx 준비
        uses: docker/setup-buildx-action@v3

      - name: 이미지 태그 준비 (short SHA)
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: app 이미지 빌드 · 푸시 (ARM64)
        # Fargate 태스크가 ARM64(Graviton)라 러너(amd64)와 다르므로 buildx로 arm64 크로스빌드
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t "$REGISTRY/$APP_REPO:$IMAGE_TAG" \
            -t "$REGISTRY/$APP_REPO:latest" \
            --push .

      - name: EMAIL_PASSWORD를 Secrets Manager에 주입
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          if aws secretsmanager describe-secret --secret-id "$EMAIL_PASSWORD_SECRET_NAME" >/dev/null 2>&1; then
            aws secretsmanager put-secret-value \
              --secret-id "$EMAIL_PASSWORD_SECRET_NAME" \
              --secret-string "$EMAIL_PASSWORD" >/dev/null
          else
            aws secretsmanager create-secret \
              --name "$EMAIL_PASSWORD_SECRET_NAME" \
              --secret-string "$EMAIL_PASSWORD" >/dev/null
          fi
          ARN=$(aws secretsmanager describe-secret --secret-id "$EMAIL_PASSWORD_SECRET_NAME" --query ARN --output text)
          echo "EMAIL_PASSWORD_SECRET_ARN=$ARN" >> "$GITHUB_ENV"

      - name: task-definition 렌더링
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          APP_IMAGE_TAG: ${{ env.IMAGE_TAG }}
          NGINX_IMAGE_TAG: v1
          EXECUTION_ROLE_ARN: ${{ secrets.EXECUTION_ROLE_ARN }}
          TASK_ROLE_ARN: ${{ secrets.TASK_ROLE_ARN }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}
          AWS_S3_BASE_URL: ${{ secrets.AWS_S3_BASE_URL }}
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_CONSUMER_GROUP_ID: ${{ secrets.KAFKA_CONSUMER_GROUP_ID }}
          EMAIL_ACCOUNT: ${{ vars.EMAIL_ACCOUNT }}
          DB_PASSWORD_SECRET_ARN: ${{ secrets.DB_PASSWORD_SECRET_ARN }}
          JWT_SECRET_ARN: ${{ secrets.JWT_SECRET_ARN }}
          ADMIN_PASSWORD_SECRET_ARN: ${{ secrets.ADMIN_PASSWORD_SECRET_ARN }}
          KAFKA_API_KEY_SECRET_ARN: ${{ secrets.KAFKA_API_KEY_SECRET_ARN }}
          KAFKA_API_SECRET_SECRET_ARN: ${{ secrets.KAFKA_API_SECRET_SECRET_ARN }}
          # EMAIL_PASSWORD_SECRET_ARN 은 앞 단계에서 GITHUB_ENV 로 주입됨
        run: |
          sudo apt-get update -y && sudo apt-get install -y gettext-base
          DEFINED_VARS=$(env | cut -d= -f1 | awk '{printf "${%s} ", $1}')
          envsubst "$DEFINED_VARS" < deploy/ecs/task-definition.json > /tmp/task-def.json
          if grep -q '\${' /tmp/task-def.json; then
            echo "치환되지 않은 플레이스홀더가 있습니다:"; grep -n '\${' /tmp/task-def.json; exit 1
          fi

      - name: task-def 등록 · ECS 배포
        # register-task-definition + update-service + services-stable
        # eventual consistency로 인한 간헐 실패를 자동 재시도
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: /tmp/task-def.json
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          force-new-deployment: true
          wait-for-service-stability: true

      - name: ECS 배포 상태 확인
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query "services[0].deployments" --output table
