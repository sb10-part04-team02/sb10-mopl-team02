import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort

plugins {
    id 'java'
    id 'jacoco'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'com.github.spotbugs' version '6.0.26'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.team02'
version = '0.0.1-SNAPSHOT'
description = 'mopl'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // === Spring Boot 핵심 스타터 ===
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // === 보안 / 인증 ===
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.9.1'

    // === 실시간 통신 ===
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // === 데이터 저장소 ===
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.6'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // === AWS SDK v2 (S3) ===
    implementation platform('software.amazon.awssdk:bom:2.34.0')
    implementation 'software.amazon.awssdk:s3'

    // === QueryDSL (Jakarta) ===
    implementation 'com.querydsl:querydsl-jpa::jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt::jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // === Lombok & MapStruct ===
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'  // Lombok + MapStruct 연동
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    // === API 문서 (Swagger UI) ===
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    // === 정적 분석 ===
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.6'

    // === 테스트 ===
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:localstack'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 's3-live' // 실제 AWS S3 자격증명이 필요한 라이브 테스트는 기본 실행에서 제외
    }
    finalizedBy jacocoTestReport
}

// 실제 AWS S3 버킷에 접속하는 라이브 테스트 전용 태스크. 수동으로만 실행:
// ./gradlew liveS3Test
tasks.register('liveS3Test', Test) {
    description = 'Runs live tests against a real AWS S3 bucket (requires AWS credentials)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 's3-live'
    }
}

jacoco {
    toolVersion = '0.8.12'
}

// 커버리지 측정에서 제외할 자동 생성·측정 불가 코드
def jacocoExcludes = [
    '**/entity/Q*.class',       // QueryDSL 자동생성
    '**/*MapperImpl.class',     // MapStruct 자동생성(@Generated가 SOURCE 유지라 자동제외 안 됨)
    '**/MoplApplication.class'  // 부트스트랩(main 메서드만 존재)
]

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExcludes)
        })
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    afterEvaluate {
        classDirectories.setFrom(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExcludes)
        })
    }
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat()
        removeUnusedImports()
    }
}

spotbugs {
    effort.set(Effort.valueOf('DEFAULT'))          // 분석 강도 (MAX로 올리면 더 꼼꼼·느림)
    reportLevel.set(Confidence.valueOf('DEFAULT'))  // 보고 민감도 (LOW로 올리면 더 많이 보고)
    excludeFilter.set(file('config/spotbugs/exclude.xml'))
    ignoreFailures = false                          // 위반 시 CI 실패(게이트)
}

tasks.spotbugsMain {
    reports {
        html.required = true
        xml.required = true
    }
}

// Git pre-commit 훅 자동 설치 — 커밋 시 spotlessApply 가 자동 실행되어 포맷 위반이 커밋되지 않게 한다.
// 원본은 config/git-hooks/ 에 버전 관리되며, 빌드 시 .git/hooks/ 로 복사된다.
tasks.register('installGitHooks', Copy) {
    description = 'config/git-hooks 의 훅을 .git/hooks 로 설치한다'
    group = 'build setup'
    from "$rootDir/config/git-hooks"
    into "$rootDir/.git/hooks"
    fileMode = 0755
    // .git 디렉터리가 없는 환경(예: CI 체크아웃 일부)에서는 조용히 건너뜀
    onlyIf { file("$rootDir/.git").exists() }
}

// 빌드 라이프사이클에 묶어, 팀원이 한 번 빌드하면 훅이 설치되게 한다.
tasks.named('build') {
    dependsOn 'installGitHooks'
}
