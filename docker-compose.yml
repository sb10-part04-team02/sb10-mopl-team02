services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/01_schema_v8.sql:/docker-entrypoint-initdb.d/01_schema_v8.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:?DB_USERNAME is required} -d ${DB_NAME:?DB_NAME is required}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"

  # 메트릭 수집: 호스트에서 실행 중인 앱(:8080)의 /actuator/prometheus를 스크레이프한다.
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      # Linux에서도 host.docker.internal로 호스트에 접근할 수 있게 한다 (Mac/Windows는 기본 지원)
      - "host.docker.internal:host-gateway"

  # 메트릭 시각화: http://localhost:3000 (기본 계정 admin/admin, .env로 오버라이드 가능)
  # 데이터소스와 대시보드는 config/monitoring/grafana 에서 자동 프로비저닝된다.
  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./config/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis-data:
  prometheus_data:
  grafana_data:
