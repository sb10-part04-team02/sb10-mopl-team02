# ECS nginx 전용 설정 (2차 배포: app 서비스와 분리, Service Connect로 upstream 연결).
# 로컬 config/nginx/nginx.conf와 동일하되, upstream만 Service Connect 별칭(app.mopl.local:8080)으로 변경했다.
# 나머지(SSE 버퍼링 off, WebSocket upgrade, body size)는 로컬과 동일하게 유지한다.
pid /tmp/nginx.pid;
events { }

http {
    # WebSocket upgrade 요청 여부에 따라 Connection 헤더 값을 동적으로 결정한다.
    # SockJS는 /ws/info 같은 일반 HTTP 요청도 사용하므로, 모든 /ws 요청에 upgrade를 강제하면 안 된다.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # 요청을 전달할 Spring Boot 서버(Service Connect 별칭, app 서비스에 분산).
    # 별칭은 DNS 레코드가 아니라 ECS가 태스크 /etc/hosts에 주입한 VIP로 해석되므로,
    # resolver가 아닌 기동 시 /etc/hosts를 읽는 정적 upstream을 사용해야 한다.
    # 같은 엔드포인트를 2줄 명시해야 proxy_next_upstream 재시도가 동작한다(단일 서버면 재시도 안 함).
    # max_fails=0: 장애 판정을 꺼 항상 재시도 대상으로 유지(둘 다 같은 IP라 down 전파 방지).
    upstream mopl_backend {
        server app.mopl.local:8080 max_fails=0;
        server app.mopl.local:8080 max_fails=0;
    }

    # 어떤 app 인스턴스로 요청이 전달됐는지 로그에서 확인하기 위한 포맷.
    # Service Connect 특성상 upstream_addr은 로컬 프록시 VIP로 고정되므로, 분산 확인은 app Task 로그로 한다.
    log_format upstreamlog
    '$remote_addr - $request '
    'status=$status upstream=$upstream_addr '
    'response_time=$request_time upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log upstreamlog;

    server {
        # ALB가 이 8080 포트로 요청을 전달한다 (D3: nginx-unprivileged non-root).
        listen 8080;

        # Spring multipart max-request-size(20MB)에 맞춰 Nginx 요청 본문 크기 제한을 설정한다.
        client_max_body_size 20m;

        # nginx 컨테이너 자체 생존 확인용. app으로 프록시하지 않고 nginx가 즉시 응답한다.
        # ECS 컨테이너 헬스체크 전용 — app 상태와 결합하지 않기 위함(app이 죽어도 nginx는 healthy 유지).
        # end-to-end(nginx→app) 확인은 ALB 타겟그룹 헬스체크(/actuator/health)가 담당한다.
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        # actuator 엔드포인트는 외부에 노출하지 않는다.
        # 앱 SecurityConfig가 /api/** 외 경로를 permitAll 처리해 actuator가 무인증 공개되므로,
        # 엣지(nginx)에서 먼저 차단한다. 앱 레벨 인증 경계는 별도 이슈로 근본 수정 예정.
        # ALB 헬스체크가 쓰는 /actuator/health만 정확 매치로 통과시킨다(= 가 접두 매치보다 우선).
        location = /actuator/health {
            proxy_pass http://mopl_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 프록시 실패 시 재시도(순단 완화).
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # 그 외 actuator(/actuator, /actuator/prometheus 등)는 외부 접근 차단.
        location /actuator {
            return 403;
        }

        # 일반 HTTP 요청 처리.
        # 프론트 정적 파일, REST API 등 대부분의 요청이 여기로 들어온다.
        location / {
            proxy_pass http://mopl_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 프록시 실패 시 재시도(순단 완화).
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # SSE(Server-Sent Events) 요청 처리.
        # 알림 스트림처럼 연결을 오래 유지하는 API라 일반 요청과 설정을 분리한다.
        location /api/sse {
            proxy_pass http://mopl_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE는 keep-alive 스트림이므로 Connection 헤더를 비워 프록시 간섭을 줄인다.
            proxy_set_header Connection "";

            # 연결 수립 시점의 실패 재시도(순단 완화). nginx는 응답 시작 후엔 재시도를 원천 차단하므로
            # 상태 코드를 포함해도 스트림 도중 재시도 위험은 없다.
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            # SSE 응답을 Nginx가 버퍼링하면 실시간 이벤트가 늦게 도착할 수 있으므로 끈다.
            proxy_buffering off;
            proxy_cache off;

            # SSE 연결이 오래 유지될 수 있으므로 timeout을 길게 둔다.
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;

            add_header X-Accel-Buffering no;
        }

        # WebSocket 요청 처리.
        # 현재 프로젝트의 STOMP/WebSocket 엔드포인트가 /ws라서 별도 location으로 둔다.
        location /ws {
            proxy_pass http://mopl_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade 요청에 필요한 헤더.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # 연결 수립 시점의 실패 재시도(순단 완화). nginx는 응답 시작 후엔 재시도를 원천 차단하므로
            # 상태 코드를 포함해도 스트림 도중 재시도 위험은 없다.
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
