# Prometheus 스크레이프 설정.
# 로컬 개발 기준: 앱은 호스트(./gradlew bootRun, :8080)에서 실행되고
# Prometheus는 docker-compose 컨테이너에서 host.docker.internal로 호스트의 앱에 접근한다.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: mopl
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080
