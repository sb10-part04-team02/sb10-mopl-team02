# Nginx 이벤트 처리 기본 블록.
# 최소 설정에서는 비워둬도 동작한다.
events { }

http {
    # WebSocket upgrade 요청 여부에 따라 Connection 헤더 값을 동적으로 결정한다.
    # SockJS는 /ws/info 같은 일반 HTTP 요청도 사용하므로, 모든 /ws 요청에 upgrade를 강제하면 안 된다.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # 요청을 전달할 Spring Boot 서버 묶음.
    # Docker Compose 네트워크에서는 서비스명(app-1, app-2)으로 컨테이너를 찾을 수 있다.
    # localhost:8080 진입 시 nginx가 RR 방식으로 app-1/app-2 번갈아가며 요청 보냄
    upstream mopl_backend {
        server app-1:8080;
        server app-2:8080;
    }

    # 어떤 app 인스턴스로 요청이 전달됐는지 로그에서 확인하기 위한 포맷.
    # upstream=$upstream_addr 값으로 app-1/app-2 분산 여부를 볼 수 있다.
    log_format upstreamlog
    '$remote_addr - $request '
    'status=$status upstream=$upstream_addr '
    'response_time=$request_time upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log upstreamlog;

    # 요청 Host 헤더에서 포트 번호만 추출하고, 포트가 없으면 $server_port를 사용
    map $http_host $forwarded_port {
        ~^[^:]+:(?<port>\d+)$ $port;
        default               $server_port;
    }

    server {
        # Nginx 컨테이너 내부에서 80 포트로 요청을 받는다.
        # docker-compose에서 "8080:80"으로 매핑하면 로컬에서는 http://localhost:8080 으로 접근한다.
        listen 80;

        # Spring multipart max-request-size(20MB)에 맞춰 Nginx 요청 본문 크기 제한을 설정한다.
        client_max_body_size 20m;

        # 일반 HTTP 요청 처리.
        # 프론트 정적 파일, REST API 등 대부분의 요청이 여기로 들어온다.
        location / {
            proxy_pass http://mopl_backend;
            proxy_http_version 1.1;

            # 원 요청 정보를 Spring Boot 쪽으로 전달한다.
            # 추후 로그, 인증, 리다이렉트, HTTPS 판단 등에 사용할 수 있다.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $forwarded_port;
        }

        # SSE(Server-Sent Events) 요청 처리.
        # 알림 스트림처럼 연결을 오래 유지하는 API라 일반 요청과 설정을 분리한다.
        location /api/sse {
            proxy_pass http://mopl_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE는 keep-alive 스트림이므로 Connection 헤더를 비워 프록시 간섭을 줄인다.
            proxy_set_header Connection "";

            # SSE 응답을 Nginx가 버퍼링하면 실시간 이벤트가 늦게 도착할 수 있으므로 끈다.
            proxy_buffering off;
            proxy_cache off;

            # SSE 연결이 오래 유지될 수 있으므로 timeout을 길게 둔다.
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;

            # 일부 프록시 환경에서 응답 버퍼링을 끄도록 힌트를 준다.
            add_header X-Accel-Buffering no;
        }

        # WebSocket 요청 처리.
        # 현재 프로젝트의 STOMP/WebSocket 엔드포인트가 /ws라서 별도 location으로 둔다.
        location /ws {
            proxy_pass http://mopl_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade 요청에 필요한 헤더.
            # SockJS의 /ws/info 같은 일반 HTTP 요청은 $http_upgrade 값이 비어 있으므로
            # 위의 map 설정에 따라 Connection 헤더가 close로 전달된다.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # WebSocket도 연결이 오래 유지될 수 있으므로 timeout을 길게 둔다.
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}