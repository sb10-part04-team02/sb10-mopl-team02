# docker-compose.yml (ELK 스택 - 로컬 개발용)
#
# 전체 흐름:
#   앱 --(TCP 5000, JSON)--> Logstash --(HTTP 9200)--> Elasticsearch <--(조회)-- Kibana <-- 브라우저 :5601
services:
  # Elasticsearch - 로그를 실제로 저장하고 검색하는 엔진
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    environment:
      - discovery.type=single-node      # 단일 노드 모드
      - xpack.security.enabled=false    # 보안 기능 비활성화 - 로컬 전용 설정
      - ES_JAVA_OPTS=-Xms512m -Xmx512m  # JVM 힙 메모리 설정
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Logstash - 앱이 보낸 TCP 로그를 받아 가공하여 ES에 적재하는 파이프라인
  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.4
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - XPACK_MONITORING_ENABLED=false  # Logstash 성능 지표를 ES로 보내는 기능 off - 로컬에서 불필요
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro  # 파이프라인 설정 마운트
    ports:
      - "5000:5000"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Kibana - ES에 쌓인 로그를 브라우저에서 보는 UI
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.4
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Kibana가 뜨면 mopl-logs-* data view를 자동 생성하고 종료하는 one-shot 컨테이너.
  # ES가 볼륨 없이 초기화되는 구성이라 down 후 재기동 때마다 data view를 복구해준다.
  kibana-init:
    image: docker.elastic.co/kibana/kibana:8.17.4
    depends_on:
      - kibana
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    # Kibana API가 응답할 때까지 3초 간격으로 최대 60번 폴링
    # mopl-logs-* data view가 이미 있으면 그대로 종료
    # 없으면 Kibana API에 POST를 날려 data view 생성
    command:
      - |
        i=0
        until curl -fs http://kibana:5601/api/status >/dev/null; do
          i=$$((i+1))
          [ "$$i" -ge 60 ] && echo "kibana not ready, giving up" && exit 1
          sleep 3
        done
        if curl -fs http://kibana:5601/api/data_views | grep -q 'mopl-logs-\*'; then
          echo "data view already exists, skipping"
        else
          curl -fs -X POST http://kibana:5601/api/data_views/data_view \
            -H 'kbn-xsrf: true' -H 'Content-Type: application/json' \
            -d '{"data_view":{"title":"mopl-logs-*","timeFieldName":"@timestamp","name":"mopl-logs"}}' \
            && echo "" && echo "data view created"
        fi
