# 부하테스트용 로컬 Kafka override.
# 운영은 Confluent Cloud(SASL)를 쓰지만, 로컬 부하테스트에서는 인증 없는 평문 KRaft 단일 노드로
# 알림 발행 경로를 살려 둔다. Kafka 가 없으면 구독/알림 트랜잭션이 커넥션을 오래 잡아 HikariCP 풀이
# 고갈되고, write 시나리오의 순수 락 경합 측정이 오염된다.
#
# 실행: docker compose --env-file .env -f docker-compose.yml -f docker-compose.loadtest.yml up -d
# 앱은 KAFKA_BOOTSTRAP_SERVERS=localhost:9092 로 접속(포트 매핑). 토픽은 auto-create.
services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
