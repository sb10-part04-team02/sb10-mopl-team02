spring:
  config:
    activate:
      on-profile: test

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: senderExample@gmail.com
    password: 1234@QWER
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true    # TLS 보안설정

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-id
            client-secret: test-google-secret
          kakao:
            client-id: test-kakao-id
            client-secret: test-kakao-secret

app:
  realtime:
    redis-fan-out:
      enabled: false

  tmdb:
    access-token: dummy-token-for-testing
  sportsdb:
    api-key: dummy-key-for-testing
  jwt:
    secret-key: ${JWT_SECRET_KEY:"this-is-a-dummy-secret-key-for-testing-purposes-only-32bytes"}
  admin:
    email: ${ADMIN_EMAIL:test-admin@example.com}
    password: ${ADMIN_PASSWORD:test-password123!}
    name: ${ADMIN_NAME:test-name}
