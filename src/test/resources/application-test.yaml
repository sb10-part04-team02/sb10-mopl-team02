spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:mopl;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # 테스트는 엔티티로부터 스키마를 생성하므로 운영용 SQL 초기화는 끈다
  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: false
