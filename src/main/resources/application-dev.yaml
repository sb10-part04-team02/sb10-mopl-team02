spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mopl}
    username: ${DB_USERNAME:mopl}
    password: ${DB_PASSWORD:mopl}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: never
  #      schema-locations: classpath:01_schema_v8.sql

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
    show-sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret-key: ${JWT_SECRET_KEY:"local-dev-insecure-jwt-secret-change-me-in-env"}
  storage:
    local:
      public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080}
