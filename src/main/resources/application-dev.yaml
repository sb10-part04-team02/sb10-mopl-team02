spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mopl}
    username: ${DB_USERNAME:mopl}
    password: ${DB_PASSWORD:mopl}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
    show-sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret-key: ${JWT_SECRET_KEY:"local-dev-insecure-jwt-secret-change-me-in-env"}
  storage:
    local:
      public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080}
  kafka:
    smoke-test:
      # 스모크 테스트할 때만 true 로. true 면 카프카 브로커가 떠 있어야 한다.
      enabled: ${KAFKA_SMOKE_TEST_ENABLED:false}

logging:
  level:
    com.team02.mopl: DEBUG
