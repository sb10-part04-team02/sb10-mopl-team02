spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false
    show-sql: false

server:
  port: ${SERVER_PORT:8080}

app:
  ingestion:
    scheduler:
      enabled: ${INGESTION_SCHEDULER_ENABLED:true}
      cron: ${INGESTION_SCHEDULER_CRON:0 0 4 * * *}