spring:
  application:
    name: mopl

  profiles:
    active: dev

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 10MB     # 업로드 가능한 개별 파일의 최대 크기
      max-request-size: 20MB  # 단일 요청 전체의 최대 크기

app:
  admin:
    email: "${ADMIN_EMAIL:?관리자 환경변수가 누락되었습니다}"
    password: "${ADMIN_PASSWORD:?관리자 패스워드가 누락되었습니다}"
    name: "${ADMIN_NAME:?관리자 이름이 누락되었습니다}"
  storage:
    local:
      base-path: storage   # 파일이 저장되는 디스크상의 디렉터리 경로
      base-url: /files     # 저장된 파일을 서빙하는 URL 경로 접두사
      public-base-url: ""  # dev에서만 절대 URL로 오버라이드
    # 썸네일 미제공 시 내려줄 기본 URL
    default-thumbnail-url: "" # TODO: S3 전환 후속 이슈에서 실제 기본 이미지의 절대 URL로 교체
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-expiration: 10m  # 10분
    refresh-token-expiration: 7d  # 일주일
    redis:
      refresh-prefix: "jwt:refresh:"
      max-account-count: 1
      blacklist-prefix: "jwt:blacklist:"
