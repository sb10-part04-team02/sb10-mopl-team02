spring:
  application:
    name: mopl

  profiles:
    active: dev

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:mopl-local}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  servlet:
    multipart:
      max-file-size: 10MB     # 업로드 가능한 개별 파일의 최대 크기
      max-request-size: 20MB  # 단일 요청 전체의 최대 크기

app:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    name: ${ADMIN_NAME}
  storage:
    local:
      base-path: storage   # 파일이 저장되는 디스크상의 디렉터리 경로
      base-url: /files     # 저장된 파일을 서빙하는 URL 경로 접두사
      public-base-url: ""  # dev에서만 절대 URL로 오버라이드
    # 썸네일 미제공 시 내려줄 기본 URL
    default-thumbnail-url: "" # TODO: S3 전환 후속 이슈에서 실제 기본 이미지의 절대 URL로 교체
  tmdb:
    access-token: ${TMDB_ACCESS_TOKEN:}  # v4 Read Access Token
    base-url: https://api.themoviedb.org/3
    image-base-url: https://image.tmdb.org/t/p/w500
    language: ko-KR
    pages: 3  # popular 수집 페이지 수 (페이지당 20건)
    connect-timeout: 3s
    read-timeout: 10s
    run-on-startup: false  # true면 기동 시 1회 수집 실행 (검증/수동 실행용)
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-expiration: 10m  # 10분
    refresh-token-expiration: 7d  # 일주일
    redis:
      refresh-prefix: "jwt:refresh:"
      max-account-count: 1
      blacklist-prefix: "jwt:blacklist:"
      user-lock-prefix: "jwt:userlock:"
