spring:
  application:
    name: mopl

  profiles:
    active: dev

  flyway:
    enabled: true  # 기동 시 db/migration 마이그레이션 적용 (스키마 자동 생성·버전관리)

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:mopl-local}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  servlet:
    multipart:
      max-file-size: 10MB     # 업로드 가능한 개별 파일의 최대 크기
      max-request-size: 20MB  # 단일 요청 전체의 최대 크기

logging:
  pattern:
    correlation: "[%X{requestId:-}] "  # 전 프로파일 공통. 콘솔/파일 로그의 레벨 옆에 MDC requestId를 표시 (요청 밖 로그는 빈 값)

app:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    name: ${ADMIN_NAME}
  redis:
    outbox:
      maximum-retry-threshold: 5
      retry-delay: 10m
      clean-up: "0 0 3 * * *"
  kafka:
    consumer:
      retry:
        interval: 1s
        max-retries: 3
  storage:
    type: local            # 사용할 스토리지 구현체: local | s3
    local:
      base-path: storage   # 파일이 저장되는 디스크상의 디렉터리 경로
      base-url: /files     # 저장된 파일을 서빙하는 URL 경로 접두사
      public-base-url: ""  # dev에서만 절대 URL로 오버라이드
    s3:
      bucket: ""           # S3 버킷 이름 (운영에서 오버라이드)
      region: ""           # 버킷 리전
      base-url: ""         # 공개 접근 URL 접두사 (CDN)
    # 썸네일 미제공 시 내려줄 기본 URL. 앱 내장 정적 리소스(static/images/default-thumbnail.svg)를 서빙
    # prod는 상대 경로(동일 origin), dev는 application-dev.yaml에서 절대 URL로 오버라이드
    default-thumbnail-url: /images/default-thumbnail.svg
  tmdb:
    access-token: ${TMDB_ACCESS_TOKEN:}  # v4 Read Access Token
    base-url: https://api.themoviedb.org/3
    image-base-url: https://image.tmdb.org/t/p/w500
    language: ko-KR
    pages: 3  # popular 수집 페이지 수 (페이지당 20건)
    connect-timeout: 3s
    read-timeout: 10s
  sportsdb:
    api-key: ${SPORTSDB_API_KEY:123}  # 무료 테스트 키 "123" (30 req/min)
    base-url: https://www.thesportsdb.com/api/v1/json
    connect-timeout: 3s
    read-timeout: 10s
    leagues: # 수집 대상 리그+시즌. 시즌 표기는 리그마다 다름
      - id: "4328"
        season: "2025-2026"  # English Premier League
  ingestion:
    run-on-startup: false  # true면 기동 시 1회 전체 소스 수집 실행 (검증/수동 실행용)
    scheduler:
      enabled: ${INGESTION_SCHEDULER_ENABLED:false}  # 기본 off. 테스트/로컬에서 실행 방지
      cron: ${INGESTION_SCHEDULER_CRON:0 0 4 * * *}  # 로컬 테스트 시 주기 바꿔서 실행할 것
      lock-ttl: 30m  # 중복 실행 방지 락 TTL (최대 수집 소요보다 넉넉히)
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-expiration: 10m  # 10분
    refresh-token-expiration: 7d  # 일주일
    redis:
      refresh-prefix: "jwt:refresh:"
      max-account-count: 1
      blacklist-prefix: "jwt:blacklist:"
      user-lock-prefix: "jwt:userlock:"
