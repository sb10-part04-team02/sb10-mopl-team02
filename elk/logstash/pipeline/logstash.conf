# 앱(logback LogstashTcpSocketAppender)이 개행 구분 JSON을 보내므로 json_lines 필수
input {
  tcp {
    port  => 5000
    codec => json_lines
  }
}

# index 미지정 시 logstash 8.x가 ECS 기본 인덱스로 보내므로 반드시 명시
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "mopl-logs-%{+YYYY.MM.dd}"
  }
}
